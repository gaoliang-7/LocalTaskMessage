spring:
  application:
    name: local-task-message-learning

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/local_task_message_learning
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

rocketmq:
  endpoints: ${ROCKETMQ_ENDPOINTS:127.0.0.1:8081}

task-message:
  max-failures: 5
  initial-delay-seconds: 10
  max-delay-seconds: 60
  lease-seconds: 30

  send-executor:
    core-pool-size: 1
    max-pool-size: 1
    queue-capacity: 1
    rejection-policy: DEFER_TO_RETRY

  retry-groups:
    - name: house-0
      house-number: 0
      batch-size: 20
      fixed-delay-seconds: 5

    - name: house-1
      house-number: 1
      batch-size: 10
      fixed-delay-seconds: 7

---
spring:
  config:
    activate:
      on-profile: retry-house-0

task-message:
  retry-groups:
    - name: house-0
      house-number: 0
      batch-size: 20
      fixed-delay-seconds: 5

---
spring:
  config:
    activate:
      on-profile: retry-house-1

task-message:
  retry-groups:
    - name: house-1
      house-number: 1
      batch-size: 10
      fixed-delay-seconds: 7